<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --panel-2: #131313;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.12);
    --font: 'Geist', system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #eaeaea;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "tnum" 1, "cv01" 1;
  }
  /* subtle grain/vignette */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(1200px 600px at 50% -200px, rgba(56,189,150,0.05), transparent 60%);
  }
  #root { position: relative; z-index: 1; }
  ::selection { background: rgba(16,185,129,0.3); }
  input, select, textarea, button { font-family: var(--font); }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

  .ibtn {
    background: transparent; border: 1px solid transparent; color: #888; cursor: pointer;
    width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .ibtn:hover { background: rgba(255,255,255,0.07); color: #ddd; }
  .trow:hover { background: rgba(255,255,255,0.018); }

  .toast-in { animation: toastIn .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
  .page-fade { animation: pageFade .35s ease; }
  @keyframes pageFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* chart entrances — NO backwards fill: resting state is fully visible so content
     never disappears if the animation is deferred (e.g. hidden/background document) */
  .bar-grow { transform-box: fill-box; transform-origin: bottom; animation: barGrow .75s cubic-bezier(.2,.7,.2,1); }
  @keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .line-draw { animation: lineDraw 1.1s cubic-bezier(.4,.5,.2,1); }
  @keyframes lineDraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  .area-fade { animation: areaFade .8s ease .3s; }
  @keyframes areaFade { from { opacity: 0; } to { opacity: 1; } }
  .ring-fill { animation: ringFill 1s cubic-bezier(.3,.6,.2,1); }
  @keyframes ringFill { from { stroke-dashoffset: var(--c); } }
  .barh-grow { transform-box: fill-box; transform-origin: left; animation: barhGrow .9s cubic-bezier(.2,.7,.2,1); }
  @keyframes barhGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .fade-up { animation: fadeUp .5s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(9px); } }
  .pop-in { transform-origin: center; animation: popIn .6s cubic-bezier(.2,.7,.2,1); }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } }

  .tabs-mobile { display: none; }
  @media (max-width: 860px) {
    .tabs-desktop { display: none !important; }
    .tabs-mobile { display: flex !important; }
    .dash-2col { grid-template-columns: 1fr !important; }
  }

  /* ——— capa móvil (contrato ≤640px; utilitarias definidas SOLO aquí) ——— */
  .tx-cards { display: none; }
  .bottomnav {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: rgba(10,10,10,0.92);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-strong);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (max-width: 640px) {
    .m-grid { grid-template-columns: 1fr !important; }
    .m-grid-2 { grid-template-columns: 1fr 1fr !important; }
    .m-hide { display: none !important; }
    .tx-table { display: none !important; }
    .tx-cards { display: block !important; }
    .bottomnav { display: flex !important; }
    /* 80px extra sobre el padding base para que .bottomnav no tape contenido */
    main { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)) !important; }
    /* evita el zoom automático de iOS al enfocar campos */
    input, select, textarea { font-size: 16px !important; }
  }
  select option { background: #161616; color: #eee; }
</style>
